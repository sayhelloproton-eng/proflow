openapi: 3.1.0
info:
  title: ProFlow Product Actions
  version: 1.0.0
  description: Role-minimal Product access to Agent collaboration and Task owner contracts.
servers:
  - url: https://GATEWAY_PUBLIC_HOST
security:
  - bearerAuth: []
paths:
  /actions/listRegisteredRoles:
    get:
      operationId: listRegisteredRoles
      summary: List current registered ProFlow roles.
      x-openai-isConsequential: false
      responses: {'200': {description: Registered roles}}
  /actions/getRegisteredRole:
    get:
      operationId: getRegisteredRole
      summary: Read one registered role by real g-id.
      x-openai-isConsequential: false
      parameters:
        - {name: roleRef, in: query, required: true, schema: {type: string}, description: Real Custom GPT g-id.}
      responses: {'200': {description: Registered role}}
  /actions/createTask:
    post:
      operationId: createTask
      summary: Create a Task after product requirement clarification.
      description: Product role and real product worker c-id belong in roleBindings; dev and test roles may have null workerRef until Browser CREATE.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses: {'200': {description: Created Task owner facts}}
  /actions/getTask:
    get:
      operationId: getTask
      summary: Read Task owner facts.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Task owner facts}}
  /actions/putTaskDocument:
    post:
      operationId: putTaskDocument
      summary: Write a version-controlled Task document through Task owner contract.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutTaskDocumentInput'}
      responses: {'200': {description: Task document result}}
  /actions/getTaskDocument:
    get:
      operationId: getTaskDocument
      summary: Read a typed Task document.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
        - {name: documentType, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Task document}}
  /actions/askPeer:
    post:
      operationId: askPeer
      summary: Persist one collaboration question for a Task participant.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskPeerInput'}
      responses: {'200': {description: Collaboration question}}
  /actions/replyPeer:
    post:
      operationId: replyPeer
      summary: Persist a collaboration reply; physical Browser delivery follows separately.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplyPeerInput'}
      responses: {'200': {description: Collaboration reply}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    PlanNode:
      type: object
      additionalProperties: false
      required: [nodeId, title, objective, requiredRoleRef, inputDocuments, outputDocuments]
      properties:
        nodeId: {type: string}
        title: {type: string}
        objective: {type: string}
        requiredRoleRef: {type: string, description: Registered real role g-id.}
        inputDocuments: {type: array, items: {type: string}}
        outputDocuments: {type: array, items: {type: string}}
    RoleBinding:
      type: object
      additionalProperties: false
      required: [roleRef, workerRef]
      properties:
        roleRef: {type: string, description: Registered real role g-id.}
        workerRef: {type: [string, 'null'], description: Real c-id, or null before Browser CREATE.}
    CreateTaskInput:
      type: object
      additionalProperties: false
      required: [title, objective, plan, roleBindings, idempotencyKey]
      properties:
        taskId: {type: string}
        title: {type: string}
        objective: {type: string}
        plan:
          type: object
          additionalProperties: false
          required: [nodes]
          properties:
            nodes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PlanNode'}}
        initialDocuments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [documentType, content]
            properties:
              documentType: {type: string}
              content: {type: string}
        roleBindings: {type: array, items: {$ref: '#/components/schemas/RoleBinding'}}
        idempotencyKey: {type: string}
    PutTaskDocumentInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, documentType, expectedTaskVersion, idempotencyKey]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        documentType: {type: string}
        content: {type: string}
        openaiFileIdRefs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [name, id, mime_type, download_link]
            properties:
              name: {type: string}
              id: {type: string}
              mime_type: {type: string}
              download_link: {type: string, format: uri}
        expectedTaskVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
      anyOf:
        - required: [content]
        - required: [openaiFileIdRefs]
    AskPeerInput:
      type: object
      additionalProperties: false
      required: [taskId, fromWorkerRef, targetAgentPackageRef, content, idempotencyKey]
      properties:
        taskId: {type: string}
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        targetAgentPackageRef: {type: string}
        content: {type: string}
        idempotencyKey: {type: string}
    ReplyPeerInput:
      type: object
      additionalProperties: false
      required: [threadId, fromWorkerRef, content, idempotencyKey]
      properties:
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        content: {type: string}
        idempotencyKey: {type: string}

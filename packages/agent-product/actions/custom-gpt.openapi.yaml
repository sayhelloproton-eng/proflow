openapi: 3.1.0
info:
  title: ProFlow Product Actions
  version: 1.1.0
  description: Role-minimal Product access for an already-created Task; New Task and Role discovery are Extension/platform management responsibilities.
servers:
  - url: https://GATEWAY_PUBLIC_HOST
security:
  - bearerAuth: []
paths:
  /actions/getTask:
    get:
      operationId: getTask
      summary: Read current Task owner facts.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Task owner facts}}
  /actions/putTaskDocument:
    post:
      operationId: putTaskDocument
      summary: Write a Task-scoped requirement or other allowed Product document.
      description: Product works inside an Extension-created PENDING Task. Conversation files may enter through openaiFileIdRefs and are materialized by the platform before becoming formal Task documents.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutTaskDocumentInput'}
      responses: {'200': {description: Task document result}}
  /actions/getTaskDocument:
    get:
      operationId: getTaskDocument
      summary: Read a typed formal Task document.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
        - {name: documentType, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Task document}}
  /actions/askPeer:
    post:
      operationId: askPeer
      summary: Persist one collaboration question for another participant in the same Task.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AskPeerInput'}
      responses: {'200': {description: Collaboration question}}
  /actions/replyPeer:
    post:
      operationId: replyPeer
      summary: Persist a collaboration reply; physical Browser delivery follows separately.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplyPeerInput'}
      responses: {'200': {description: Collaboration reply}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    PutTaskDocumentInput:
      type: object
      additionalProperties: false
      required: [taskId, documentType, expectedTaskVersion, idempotencyKey]
      properties:
        taskId: {type: string}
        nodeId: {type: [string, 'null'], description: Optional. Requirement setup during PENDING is Task-scoped and normally has no nodeId.}
        documentType: {type: string}
        content: {type: string}
        openaiFileIdRefs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [name, id, mime_type, download_link]
            properties:
              name: {type: string}
              id: {type: string}
              mime_type: {type: string}
              download_link: {type: string, format: uri}
        expectedTaskVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
      anyOf:
        - required: [content]
        - required: [openaiFileIdRefs]
    AskPeerInput:
      type: object
      additionalProperties: false
      required: [taskId, fromWorkerRef, targetAgentPackageRef, content, idempotencyKey]
      properties:
        taskId: {type: string}
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        targetAgentPackageRef: {type: string, description: One fixed logical Agent package role in this Task.}
        content: {type: string}
        idempotencyKey: {type: string}
    ReplyPeerInput:
      type: object
      additionalProperties: false
      required: [threadId, fromWorkerRef, content, idempotencyKey]
      properties:
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        content: {type: string}
        idempotencyKey: {type: string}

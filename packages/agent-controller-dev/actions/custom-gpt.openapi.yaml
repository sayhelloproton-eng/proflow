openapi: 3.1.0
info:
  title: ProFlow Controller Dev Actions
  version: 2.0.0
  description: Role-minimal Task, Agent collaboration, and Task, Peer and Direct Tool access for Controller and Development.
servers:
  - url: https://GATEWAY_PUBLIC_HOST
security:
  - bearerAuth: []
paths:
  /actions/getTask:
    get:
      operationId: getTask
      summary: Read Task owner facts.
      x-openai-isConsequential: false
      parameters: [{name: taskId, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Task owner facts}}
  /actions/getNodeContext:
    get:
      operationId: getNodeContext
      summary: Read the formal context for one Task node.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
        - {name: nodeId, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Node context}}
  /actions/startNode:
    post:
      operationId: startNode
      summary: Start a ready node using optimistic Task and Node versions.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeVersionInput'}}}}
      responses: {'200': {description: Started node}}
  /actions/completeNode:
    post:
      operationId: completeNode
      summary: Complete a node only after owner evidence gates are met.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteNodeInput'}}}}
      responses: {'200': {description: Completed node}}
  /actions/waitNode:
    post:
      operationId: waitNode
      summary: Move a node to an explicit waiting condition.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WaitNodeInput'}}}}
      responses: {'200': {description: Waiting node}}
  /actions/failNode:
    post:
      operationId: failNode
      summary: Record a typed node failure without inventing Execution facts.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FailNodeInput'}}}}
      responses: {'200': {description: Failed node}}
  /actions/reopenNode:
    post:
      operationId: reopenNode
      summary: Reopen a node while preserving its original Task-bound worker.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReopenNodeInput'}}}}
      responses: {'200': {description: Reopened node}}
  /actions/getTaskDocument:
    get:
      operationId: getTaskDocument
      summary: Read a typed Task document.
      x-openai-isConsequential: false
      parameters:
        - {name: taskId, in: query, required: true, schema: {type: string}}
        - {name: documentType, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Task document}}
  /actions/putTaskDocument:
    post:
      operationId: putTaskDocument
      summary: Write a version-controlled Task document through Task owner contract.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PutTaskDocumentInput'}}}}
      responses: {'200': {description: Task document result}}
  /actions/askPeer:
    post:
      operationId: askPeer
      summary: Persist one collaboration question for a Task participant.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AskPeerInput'}}}}
      responses: {'200': {description: Collaboration question}}
  /actions/replyPeer:
    post:
      operationId: replyPeer
      summary: Persist a reply; physical Browser delivery follows separately.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplyPeerInput'}}}}
      responses: {'200': {description: Collaboration reply}}
  /actions/repomix:
    post:
      operationId: repomix
      summary: Read repository context through Repomix.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepomixActionInput'}}}}
      responses: {'200': {description: Repomix result}}
  /actions/localDev:
    post:
      operationId: localDev
      summary: Use Local Dev for current-disk files, commands and processes.
      x-openai-isConsequential: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocalDevActionInput'}}}}
      responses: {'200': {description: Local Dev result}}
  /actions/codeGraph:
    post:
      operationId: codeGraph
      summary: Explore repository structure, callers, dependencies, ownership and impact.
      x-openai-isConsequential: false
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CodeGraphActionInput'}}}}
      responses: {'200': {description: CodeGraph result}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    NodeVersionInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, expectedNodeVersion, idempotencyKey]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        expectedTaskVersion: {type: integer, minimum: 1}
        expectedNodeVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
    CompleteNodeInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, expectedNodeVersion, idempotencyKey, resultSummary]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        expectedTaskVersion: {type: integer, minimum: 1}
        expectedNodeVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
        resultSummary: {type: string}
    WaitNodeInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, expectedNodeVersion, idempotencyKey, waitType, reasonCode, message]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        expectedTaskVersion: {type: integer, minimum: 1}
        expectedNodeVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
        waitType: {type: string, enum: [BUSINESS_CONFIRMATION, REQUIREMENT_BLOCKED, EXTERNAL_BUSINESS_DEPENDENCY]}
        reasonCode: {type: string}
        message: {type: string}
        relatedRef: {type: string}
    FailNodeInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, expectedNodeVersion, idempotencyKey, errorCode, errorMessage, retryable]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        expectedTaskVersion: {type: integer, minimum: 1}
        expectedNodeVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
        errorCode: {type: string}
        errorMessage: {type: string}
        retryable: {type: boolean}
    ReopenNodeInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, idempotencyKey, reason]
      properties:
        taskId: {type: string}
        nodeId: {type: string}
        expectedTaskVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
        reason: {type: string}
    PutTaskDocumentInput:
      type: object
      additionalProperties: false
      required: [taskId, nodeId, expectedTaskVersion, idempotencyKey, documentType]
      properties:
        taskId: {type: string}
        nodeId: {type: [string, 'null']}
        expectedTaskVersion: {type: integer, minimum: 1}
        idempotencyKey: {type: string}
        documentType: {type: string}
        content: {type: string}
        openaiFileIdRefs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [name, id, mime_type, download_link]
            properties:
              name: {type: string}
              id: {type: string}
              mime_type: {type: string}
              download_link: {type: string, format: uri}
      anyOf:
        - required: [content]
        - required: [openaiFileIdRefs]
    AskPeerInput:
      type: object
      additionalProperties: false
      required: [taskId, fromWorkerRef, targetAgentPackageRef, content, idempotencyKey]
      properties:
        taskId: {type: string}
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        targetAgentPackageRef: {type: string}
        content: {type: string}
        idempotencyKey: {type: string}
    ReplyPeerInput:
      type: object
      additionalProperties: false
      required: [threadId, fromWorkerRef, content, idempotencyKey]
      properties:
        threadId: {type: string}
        fromWorkerRef: {type: string, description: Caller's real Task-bound c-id.}
        content: {type: string}
        idempotencyKey: {type: string}
    LocalDevActionInput:
      oneOf:
        - {$ref: '#/components/schemas/LocalDevReadAction'}
        - {$ref: '#/components/schemas/LocalDevListAction'}
        - {$ref: '#/components/schemas/LocalDevSearchAction'}
        - {$ref: '#/components/schemas/LocalDevMutateAction'}
        - {$ref: '#/components/schemas/LocalDevRunAction'}
        - {$ref: '#/components/schemas/LocalDevProcessAction'}
    RepomixActionInput:
      oneOf:
        - {$ref: '#/components/schemas/RepomixPackAction'}
        - {$ref: '#/components/schemas/RepomixGrepAction'}
        - {$ref: '#/components/schemas/RepomixReadAction'}
    RepomixPackAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: pack}
        input:
          type: object
          additionalProperties: false
          properties:
            directory: {type: string}
            includePatterns: {type: array, maxItems: 100, items: {type: string}}
            ignorePatterns: {type: array, maxItems: 100, items: {type: string}}
            compress: {type: boolean}
    RepomixGrepAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: grep}
        input:
          type: object
          additionalProperties: false
          required: [outputId, pattern]
          properties:
            outputId: {type: string}
            pattern: {type: string}
            contextLines: {type: integer, minimum: 0, maximum: 50}
            maxMatches: {type: integer, minimum: 1, maximum: 2000}
    RepomixReadAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: read}
        input:
          type: object
          additionalProperties: false
          required: [outputId]
          properties:
            outputId: {type: string}
            startLine: {type: integer, minimum: 1}
            endLine: {type: integer, minimum: 1}
    CodeGraphActionInput:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: explore}
        input:
          type: object
          additionalProperties: false
          required: [query]
          properties:
            query: {type: string}
            projectPath: {type: string}
            maxFiles: {type: integer, minimum: 1, maximum: 50}
    LocalDevReadAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: read}
        input:
          type: object
          additionalProperties: false
          properties:
            path: {type: string}
            paths: {type: array, minItems: 1, maxItems: 64, items: {type: string}}
            maxBytes: {type: integer, minimum: 1, maximum: 500000}
          anyOf:
            - required: [path]
            - required: [paths]
    LocalDevListAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: list}
        input:
          type: object
          additionalProperties: false
          properties:
            path: {type: string}
            maxEntries: {type: integer, minimum: 1, maximum: 5000}
    LocalDevSearchAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: search}
        input:
          type: object
          additionalProperties: false
          required: [query]
          properties:
            query: {type: string}
            mode: {type: string, enum: [literal, regex, filename]}
            path: {type: string}
            paths: {type: array, maxItems: 64, items: {type: string}}
            maxResults: {type: integer, minimum: 1, maximum: 2000}
    LocalDevCommandInput:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: {type: string}
        args: {type: array, maxItems: 256, items: {type: string}}
        cwd: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        timeoutMs: {type: integer, minimum: 1, maximum: 40000}
        maxOutputBytes: {type: integer, minimum: 1, maximum: 250000}
    LocalDevRunAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: run}
        input: {$ref: '#/components/schemas/LocalDevCommandInput'}
    LocalDevMutateAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: mutate}
        input:
          oneOf:
            - {type: object, additionalProperties: false, required: [action, path, content], properties: {action: {type: string, const: create}, path: {type: string}, content: {type: string}, createParents: {type: boolean}}}
            - {type: object, additionalProperties: false, required: [action, path, content], properties: {action: {type: string, const: write}, path: {type: string}, content: {type: string}, createParents: {type: boolean}}}
            - {type: object, additionalProperties: false, required: [action, path, oldText, newText], properties: {action: {type: string, const: edit}, path: {type: string}, oldText: {type: string}, newText: {type: string}, expectedReplacements: {type: integer, minimum: 1, maximum: 10000}}}
            - {type: object, additionalProperties: false, required: [action, path], properties: {action: {type: string, const: mkdir}, path: {type: string}, recursive: {type: boolean}}}
            - {type: object, additionalProperties: false, required: [action, source, destination], properties: {action: {type: string, const: move}, source: {type: string}, destination: {type: string}}}
            - {type: object, additionalProperties: false, required: [action, path], properties: {action: {type: string, const: delete}, path: {type: string}, recursive: {type: boolean}, force: {type: boolean}}}
    LocalDevProcessAction:
      type: object
      additionalProperties: false
      required: [operation, input]
      properties:
        operation: {type: string, const: process}
        input:
          oneOf:
            - {$ref: '#/components/schemas/LocalDevProcessListInput'}
            - {$ref: '#/components/schemas/LocalDevProcessPortsInput'}
            - {$ref: '#/components/schemas/LocalDevProcessStartInput'}
            - {$ref: '#/components/schemas/LocalDevProcessStatusInput'}
            - {$ref: '#/components/schemas/LocalDevProcessReadInput'}
            - {$ref: '#/components/schemas/LocalDevProcessInputInput'}
            - {$ref: '#/components/schemas/LocalDevProcessStopInput'}
    LocalDevProcessListInput:
      type: object
      additionalProperties: false
      required: [action]
      properties: {action: {type: string, const: list}, maxOutputBytes: {type: integer, minimum: 1, maximum: 250000}}
    LocalDevProcessPortsInput:
      type: object
      additionalProperties: false
      required: [action]
      properties: {action: {type: string, const: ports}, port: {type: integer, minimum: 1, maximum: 65535}, maxOutputBytes: {type: integer, minimum: 1, maximum: 250000}}
    LocalDevProcessStartInput:
      type: object
      additionalProperties: false
      required: [action, command]
      properties:
        action: {type: string, const: start}
        command: {type: string}
        args: {type: array, maxItems: 256, items: {type: string}}
        cwd: {type: string}
        env: {type: object, additionalProperties: {type: string}}
    LocalDevProcessStatusInput:
      type: object
      additionalProperties: false
      required: [action, processRef]
      properties: {action: {type: string, const: status}, processRef: {type: string}}
    LocalDevProcessReadInput:
      type: object
      additionalProperties: false
      required: [action, processRef]
      properties: {action: {type: string, const: read}, processRef: {type: string}, stream: {type: string, enum: [stdout, stderr]}, offset: {type: integer, minimum: 0}, limit: {type: integer, minimum: 1, maximum: 250000}}
    LocalDevProcessInputInput:
      type: object
      additionalProperties: false
      required: [action, processRef, data]
      properties: {action: {type: string, const: input}, processRef: {type: string}, data: {type: string}}
    LocalDevProcessStopInput:
      type: object
      additionalProperties: false
      required: [action, processRef]
      properties: {action: {type: string, const: stop}, processRef: {type: string}}

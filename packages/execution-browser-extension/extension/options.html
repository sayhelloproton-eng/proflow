<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>ProFlow Runtime Bridge</title>
		<style>
			body { font: 14px system-ui; margin: 24px; max-width: 680px; }
			label { display: block; margin: 16px 0; }
			input { box-sizing: border-box; display: block; margin-top: 6px; padding: 8px; width: 100%; }
			button { padding: 8px 14px; }
			#status { margin-top: 12px; }
		</style>
	</head>
	<body>
		<h1>Runtime bridge</h1>
		<p>Extension ID: <code id="extension-id"></code></p>
		<form id="bridge-form">
			<label>Loopback endpoint <input id="endpoint" required placeholder="http://127.0.0.1:47831" /></label>
			<label>Ephemeral bridge token <input id="token" type="password" required autocomplete="off" /></label>
			<button type="submit">Save bridge configuration</button>
		</form>
		<p id="status" role="status"></p>
		<script type="module" src="../dist/extension/options.js"></script>
	</body>
</html>
